<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TIB Retail Pvt. Ltd. | Video</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #fff6ef;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .video-container {
        width: 100%;
        max-width: 700px;
        text-align: center;
        background: #fff;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #f68634;
        margin-bottom: 10px;
      }

      p {
        color: #555;
        margin-bottom: 20px;
      }

      video {
        display: block;
        width: 100%;
        max-height: 75vh;
        background: #000;
        border-radius: 10px;
      }

      .download-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 28px;
        background: #f68634;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        transition: background 0.3s;
      }

      .download-btn:hover {
        background: #c96922;
      }

      @media (max-width: 480px) {
        .video-container {
          padding: 15px;
        }

        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>

  <body>
    <main class="video-container">
      <h1>TIB Retail Pvt. Ltd.</h1>

      <p>Watch and download our video</p>

      <video controls autoplay muted playsinline preload="auto">
        <source src="/2160x3840-Bosch-SBS-Film.mp4" type="video/mp4" />
        Your browser does not support HTML video.
      </video>

      <a
        class="download-btn"
        href="/2160x3840-Bosch-SBS-Film.mp4"
        download="2160x3840-Bosch-SBS-Film.mp4"
      >
        &#8595; Download Video
      </a>
    </main>
  </body>
</html>
